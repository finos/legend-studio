name: Test

on:
  schedule:
    - cron: '0 0 * * *' # runs every day on default/base branch
  push:
    branches:
      - master
      - 'release/**'
  pull_request:
    branches:
      - '**'

# Cancel running jobs from previous pipelines of the same workflow on PR to save resource when commits are pushed quickly
# NOTE: we don't want this behavior on default branch
# See https://stackoverflow.com/a/68422069
concurrency:
  group: ${{ github.ref == 'refs/heads/master' && format('ci-default-branch-{0}-{1}', github.sha, github.workflow) || format('ci-pr-{0}-{1}', github.ref, github.workflow) }}
  cancel-in-progress: true

# Jobs only need to read the repository; grant more per job when needed
permissions:
  contents: read

jobs:
  run-tests:
    name: Run Test Group
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # NOTE: `core` is split across parallel jobs using Jest sharding since it is by far
        # the longest-running group; Codecov merges the coverage reports from all shards.
        # Groups without a `shard` run in a single job (`test:ci` defaults to `--shard=1/1`)
        # See https://jestjs.io/docs/cli#--shard
        include:
          - group: core
            shard: 1/4
          - group: core
            shard: 2/4
          - group: core
            shard: 3/4
          - group: core
            shard: 4/4
          - group: engine-roundtrip
          - group: data-cube
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 2 # recommended for improving relevancy of test coverage reporting
      - name: Get Yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT
      - name: Setup Yarn cache
        uses: actions/cache@v4.2.3
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-
      - name: Setup Node
        uses: actions/setup-node@v4.3.0
        with:
          node-version: 24
      # NOTE: start the engine server in the background so pulling the image and booting
      # the server overlap with installing dependencies and building; we wait for it to be
      # ready right before running the tests
      - name: Start engine server
        working-directory: ./fixtures/legend-docker-setup/grammar-test-setup
        run: |
          (
            code=0
            docker compose --file=grammar-test-setup-docker-compose.yml up --detach || code=$?
            echo "$code" > "$RUNNER_TEMP/engine-up.exit"
          ) > "$RUNNER_TEMP/engine-up.log" 2>&1 &
      - name: Install dependencies
        run: yarn
      # NOTE: we cache the TypeScript build output (along with the build info files) so that
      # `tsc --build` only rebuilds projects affected by the change. The cache is keyed by
      # `yarn.lock` so it is reset whenever dependencies or package versions change, which
      # also prevents stale output from accumulating
      - name: Restore build cache
        uses: actions/cache/restore@v4.2.3
        with:
          path: |
            packages/*/lib
            packages/*/build/prod.tsbuildinfo
          key: ${{ runner.os }}-build-${{ hashFiles('yarn.lock') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-build-${{ hashFiles('yarn.lock') }}-
      - name: Build
        run: yarn build:ts && yarn build:sass
      # NOTE: all jobs produce the same build output, so only one of them needs to save it
      - name: Save build cache
        if: matrix.group == 'core' && startsWith(matrix.shard, '1/')
        uses: actions/cache/save@v4.2.3
        with:
          path: |
            packages/*/lib
            packages/*/build/prod.tsbuildinfo
          key: ${{ runner.os }}-build-${{ hashFiles('yarn.lock') }}-${{ github.sha }}
      - name: Wait for engine server
        run: |
          fail() {
            cat "$RUNNER_TEMP/engine-up.log"
            docker logs engine || true
            exit 1
          }
          for _ in {1..120}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:6300/api/server/v1/info; then
              exit 0
            fi
            # fail fast if `docker compose up` failed (e.g. image pull failure) or the server died
            if [[ -f "$RUNNER_TEMP/engine-up.exit" && "$(cat "$RUNNER_TEMP/engine-up.exit")" != '0' ]]; then
              fail
            fi
            if [[ "$(docker inspect --format '{{.State.Status}}' engine 2>/dev/null)" =~ ^(exited|dead)$ ]]; then
              fail
            fi
            sleep 5
          done
          fail
      - name: Test
        uses: nick-fields/retry@v3
        with:
          max_attempts: 2
          timeout_minutes: 60
          command: yarn test:ci ${{ matrix.group }} ${{ matrix.shard }}
      - name: Shut down engine server
        working-directory: ./fixtures/legend-docker-setup/grammar-test-setup
        run: docker compose --file=grammar-test-setup-docker-compose.yml down
      # Codecov will take care of merging the result from different test groups
      # See https://about.codecov.io/product/feature/report-merging/
      - name: Upload test coverage report
        uses: codecov/codecov-action@v5.4.0
        with:
          directory: ./build/coverage
          token: ${{ secrets.CODECOV_TOKEN }}

  run-e2e-tests:
    name: Run End-to-End Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2
      - name: Get Yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT
      - name: Setup Yarn cache
        uses: actions/cache@v4.2.3
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-
      - name: Setup Node
        uses: actions/setup-node@v4.3.0
        with:
          node-version: 24
      - name: Install dependencies
        run: yarn
      - name: Restore build cache
        uses: actions/cache/restore@v4.2.3
        with:
          path: |
            packages/*/lib
            packages/*/build/prod.tsbuildinfo
          key: ${{ runner.os }}-build-${{ hashFiles('yarn.lock') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-build-${{ hashFiles('yarn.lock') }}-
      - name: Build
        run: yarn build:ts && yarn build:sass
      - name: Install Playwright browser
        # NOTE: this normally takes under a minute, but can hang when the apt mirrors are slow
        timeout-minutes: 10
        run: yarn workspace @finos/legend-application-query-e2e exec playwright install --with-deps chromium
      - name: Run end-to-end tests
        run: yarn workspace @finos/legend-application-query-e2e test:e2e
      - name: Upload end-to-end test report
        if: failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: e2e-test-report
          path: packages/legend-application-query-e2e/build/playwright-report
          retention-days: 14
