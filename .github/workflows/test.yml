name: Test

on:
  schedule:
    - cron: '0 0 * * *' # runs every day on default/base branch
  push:
    branches:
      - master
      - 'release/**'
  pull_request:
    branches:
      - '**'

# Cancel running jobs from previous pipelines of the same workflow on PR to save resource when commits are pushed quickly
# NOTE: we don't want this behavior on default branch
# See https://stackoverflow.com/a/68422069
concurrency:
  group: ${{ github.ref == 'refs/heads/master' && format('ci-default-branch-{0}-{1}', github.sha, github.workflow) || format('ci-pr-{0}-{1}', github.ref, github.workflow) }}
  cancel-in-progress: true

jobs:
  run-tests:
    name: Run Test Group
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: core
          - group: engine-roundtrip
          - group: data-cube
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 2 # recommended for improving relevancy of test coverage reporting
      - name: Get Yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT
      - name: Setup Yarn cache
        uses: actions/cache@v4.2.3
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-
      - name: Setup Node
        uses: actions/setup-node@v4.3.0
        with:
          node-version: 21
      - name: Run engine server
        working-directory: ./fixtures/legend-docker-setup/grammar-test-setup
        run: |
          docker compose --file=grammar-test-setup-docker-compose.yml up --detach
          for _ in {1..120}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:6300/api/server/v1/info; then
              exit 0
            fi
            if [[ "$(docker inspect --format '{{.State.Running}}' engine)" != 'true' ]]; then
              docker logs engine
              exit 1
            fi
            sleep 5
          done
          docker logs engine
          exit 1
      - name: Install dependencies
        run: yarn
      - name: Build
        run: yarn build
      - name: Test
        uses: nick-fields/retry@v3
        with:
          max_attempts: 2
          timeout_minutes: 60
          command: yarn test:ci ${{ matrix.group }}
      - name: Shut down engine server
        working-directory: ./fixtures/legend-docker-setup/grammar-test-setup
        run: docker compose --file=grammar-test-setup-docker-compose.yml down
      # Codecov will take care of merging the result from different test groups
      # See https://about.codecov.io/product/feature/report-merging/
      - name: Upload test coverage report
        uses: codecov/codecov-action@v5.4.0
        with:
          directory: ./build/coverage
          token: ${{ secrets.CODECOV_TOKEN }}

  run-e2e-tests:
    name: Run End-to-End Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2
      - name: Get Yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT
      - name: Setup Yarn cache
        uses: actions/cache@v4.2.3
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-
      - name: Setup Node
        uses: actions/setup-node@v4.3.0
        with:
          node-version: 21
      - name: Install dependencies
        run: yarn
      - name: Build
        run: yarn build
      - name: Install Playwright browser
        run: yarn workspace @finos/legend-application-query-e2e exec playwright install --with-deps chromium
      - name: Run end-to-end tests
        run: yarn workspace @finos/legend-application-query-e2e test:e2e
      - name: Upload end-to-end test report
        if: failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: e2e-test-report
          path: packages/legend-application-query-e2e/build/playwright-report
          retention-days: 14
