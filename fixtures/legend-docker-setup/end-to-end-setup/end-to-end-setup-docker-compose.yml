version: '3.8'

services:
  engine:
    container_name: engine
    image: finos/legend-engine-server-http-server:snapshot
    ports:
      - 6300:6300
    networks:
      - legend
    volumes:
      - ./config:/config
    command: ['server', '/config/engine-config.json']
    healthcheck:
      test:
        [
          'CMD',
          'curl',
          '--fail',
          '--silent',
          'http://127.0.0.1:6300/api/server/v1/info',
        ]
      interval: 5s
      timeout: 5s
      retries: 120

networks:
  legend: {}
