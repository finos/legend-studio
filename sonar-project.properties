# See https://docs.sonarqube.org/latest/analysis/analysis-parameters/
sonar.organization=finos
sonar.projectKey=legend-studio
sonar.sources=packages,fixtures,scripts
sonar.exclusions=packages/**/*.scss
sonar.test.inclusions=**/*.test.*,**/TEST_DATA*.ts
sonar.coverage.exclusions=**/*.test.*,**/TEST_DATA*.ts
# First pattern is the unsharded run, second picks up the per-shard reports written by a
# parallel CI run (see `coverageDirectory` in scripts/test/jest.config.base.js). The two are
# deliberately non-overlapping, so no report is ingested twice. Scoping to `build/` also keeps
# an unrelated lcov.info shipped inside node_modules out of the analysis.
sonar.javascript.lcov.reportPaths=build/coverage/lcov.info,build/coverage/shard-*/lcov.info
